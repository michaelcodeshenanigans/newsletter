reuse_rules:
  - Store metadata and original summaries, not complete feed or article bodies.
  - Keep direct quotations exceptional, short, attributed, and linked.
  - Public availability and RSS access do not grant republication rights.
  - Use other newsletters to discover sources or attribute distinctive commentary; do not copy their wording, issue structure, or exclusive reporting.
  - Record repository licenses, but do not assume a code license covers logos, documentation, release-note prose, or linked assets.
  - Require a primary release, documentation page, repository, paper, specification, or advisory for material factual claims.
